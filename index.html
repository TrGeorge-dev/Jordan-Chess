<body>
<h1>约当棋</h1>
<div class="sub">Jordan Chess · 基于约当曲线定理的双人零和棋</div>
<div class="legend">
  <span>● 黑方</span><span>○ 白方</span>
  <span><span style="color:#d32f2f">▽</span> 闭环</span>
  <span><span style="color:#e0b020">◎</span> 最后一步</span>
</div>
<div id="status">轮到：黑方</div>
<canvas id="board"></canvas>
<div class="buttons">
  <label class="sizelabel">棋盘
    <input id="size" type="number" min="2" max="30" step="1" value="10">
  </label>

  <button id="undo">悔棋</button>
  <button id="ai" class="aibtn">人机</button>
  <button id="aivai" class="aibtn">AI-AI</button>
  <button id="side" class="aibtn" style="display:none">执黑</button>
</div>
<details>
  <summary>规则（约当曲线定理）</summary>
  <p>N×N 方格 → (N+1)×(N+1) 格点（默认 10×10，可在上方自定义 2~30）。黑先白后，轮流在空白格点放一枚己方棋子。同色棋子上下左右相邻视为连通（斜向不连通）。落子使己方棋子形成任意<strong>不自交闭合路径</strong>（约当曲线）即立即获胜——无论环内有无对方棋子。若棋盘下满且从未成环则为平局；棋子不可移动。点「人机」可与 AI 对战；点「AI-AI」可观看两个 V3 AI 自动对弈，再点一次即可暂停。</p>
</details>

<script>
"use strict";
const EMPTY = 0, BLACK = 1, WHITE = 2;
const CNAME = {0: "", 1: "黑方", 2: "白方"};

// ================= 引擎（与 Python 版同算法） =================
class JordanChess {
  constructor(size = 10) {
    this.size = size;
    this.n = size + 1;
    this.board = Array.from({length: this.n}, () => Array(this.n).fill(EMPTY));
    this.turn = BLACK;
    this.winner = null;              // null / BLACK / WHITE / 'DRAW'
    this.history = [];
    this.lastMove = null;
    this.lastLoops = [];
  }
  get(x, y) { return this.board[x][y]; }
  isInside(x, y) { return x >= 0 && x < this.n && y >= 0 && y < this.n; }
  isFull() { return this.board.every(r => r.every(c => c !== EMPTY)); }
  moves() {
    const out = [];
    for (let x = 0; x < this.n; x++)
      for (let y = 0; y < this.n; y++)
        if (this.board[x][y] === EMPTY) out.push([x, y]);
    return out;
  }
  place(x, y) {
    if (!this.isInside(x, y)) return {ok:false, reason:`坐标越界: (${x},${y})`};
    if (this.board[x][y] !== EMPTY) return {ok:false, reason:`格点 (${x},${y}) 已有棋子`};
    if (this.winner !== null) return {ok:false, reason:"游戏已结束"};
    const color = this.turn;
    this.board[x][y] = color;
    const loops = this._findNewCycles(x, y, color);
    if (loops.length > 0) this.winner = color;      // 闭环即胜
    else if (this.isFull()) this.winner = "DRAW";
    else this.turn = (color === BLACK ? WHITE : BLACK);
    this.lastMove = [x, y];
    this.lastLoops = loops;
    this.history.push([x, y, color]);
    return {ok:true, color:color, loops:loops, winner:this.winner};
  }
  undo() {
    if (!this.history.length) return false;
    const [x, y, color] = this.history.pop();
    this.board[x][y] = EMPTY;
    this.winner = null;
    this.turn = color;
    this.lastMove = this.history.length ? [this.history[this.history.length-1][0],
                                           this.history[this.history.length-1][1]] : null;
    this.lastLoops = [];
    return true;
  }
  _sameColorNeighbors(x, y, color) {
    const out = [];
    if (x > 0 && this.board[x-1][y] === color) out.push([x-1, y]);
    if (x < this.n-1 && this.board[x+1][y] === color) out.push([x+1, y]);
    if (y > 0 && this.board[x][y-1] === color) out.push([x, y-1]);
    if (y < this.n-1 && this.board[x][y+1] === color) out.push([x, y+1]);
    return out;
  }
  _component(start, avoid, color) {
    const seen = new Set([start[0]+","+start[1]]);
    const stack = [start];
    while (stack.length) {
      const cur = stack.pop();
      for (const nb of this._sameColorNeighbors(cur[0], cur[1], color)) {
        const k = nb[0]+","+nb[1];
        if ((nb[0]===avoid[0]&&nb[1]===avoid[1]) || seen.has(k)) continue;
        seen.add(k);
        stack.push(nb);
      }
    }
    return seen;
  }
  _findNewCycles(x, y, color) {
    const nbrs = this._sameColorNeighbors(x, y, color);
    const cycles = [];
    const seenKeys = new Set();
    for (let i = 0; i < nbrs.length; i++)
      for (let j = i+1; j < nbrs.length; j++) {
        const path = this._shortestPath(nbrs[i], nbrs[j], [x,y], color);
        if (path === null) continue;
        const cycle = [[x,y]].concat(path);
        const key = cycle.map(p=>p[0]+","+p[1]).sort().join("|");
        if (!seenKeys.has(key)) { seenKeys.add(key); cycles.push(cycle); }
      }
    return cycles;
  }
  _shortestPath(start, target, avoid, color) {
    // BFS 求 start→target 最短简单路径(避开 avoid); 不可达返回 null
    const parent = new Map([[start[0]+","+start[1], null]]);
    const queue = [start];
    let head = 0;
    while (head < queue.length) {
      const cur = queue[head++];
      if (cur[0]===target[0] && cur[1]===target[1]) break;
      for (const nb of this._sameColorNeighbors(cur[0], cur[1], color)) {
        const k = nb[0]+","+nb[1];
        if ((nb[0]===avoid[0]&&nb[1]===avoid[1]) || parent.has(k)) continue;
        parent.set(k, cur);
        queue.push(nb);
      }
    }
    const tk = target[0]+","+target[1];
    if (!parent.has(tk)) return null;
    const path = [];
    let cur = target;
    while (cur !== null) { path.push(cur); cur = parent.get(cur[0]+","+cur[1]); }
    path.reverse();
    return path;
  }
  // 射线法: 半开区间规则 (y1>py)!=(y2>py), 奇数→内部
  static pointInPolygon(px, py, poly) {
    // 射线法(半开区间规则), 当前规则不参与结算, 供规则变体使用
    let inside = false;
    const m = poly.length;
    for (let i = 0; i < m; i++) {
      const [x1, y1] = poly[i];
      const [x2, y2] = poly[(i+1)%m];
      if ((y1 > py) !== (y2 > py)) {
        const xi = x1 + (py - y1) * (x2 - x1) / (y2 - y1);
        if (xi > px) inside = !inside;
      }
    }
    return inside;
  }
}

// ================= AI 对手(威胁推理 + α-β, 与 Python 版同算法) =================
class _DSU {
  constructor(size) { this.p = Array.from({length: size}, (_, i) => i); }
  find(x) {
    while (this.p[x] !== x) { this.p[x] = this.p[this.p[x]]; x = this.p[x]; }
    return x;
  }
  union(a, b) {
    const ra = this.find(a), rb = this.find(b);
    if (ra !== rb) this.p[ra] = rb;
  }
}

const AI_WIN = 1000000, AI_LOSS = -1000000;

class LegacyJordanAI {
  constructor(game, color, timeBudget = 1.2, maxDepth = 3, seed = 1) {
    this.game = game; this.color = color;
    this.opp = (color === BLACK ? WHITE : BLACK);
    this.timeBudget = timeBudget; this.maxDepth = maxDepth;
    this._deadline = 0; this._candLimit = 14;
    this._s = (seed || 1) >>> 0;
  }
  _rng() {   // 确定性伪随机 0..1
    this._s = (this._s * 1103515245 + 12345) & 0x7fffffff;
    return this._s / 0x7fffffff;
  }
  _idx(x, y) { return x * this.game.n + y; }
  _buildDsu(color) {
    const g = this.game, n = g.n, b = g.board;
    const dsu = new _DSU(n * n);
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== color) continue;
        const i = this._idx(x, y);
        if (x > 0 && b[x-1][y] === color) dsu.union(i, this._idx(x-1, y));
        if (x < n-1 && b[x+1][y] === color) dsu.union(i, this._idx(x+1, y));
        if (y > 0 && b[x][y-1] === color) dsu.union(i, this._idx(x, y-1));
        if (y < n-1 && b[x][y+1] === color) dsu.union(i, this._idx(x, y+1));
      }
    return dsu;
  }
  _threats(color, limit) {
    const g = this.game, n = g.n, b = g.board;
    const dsu = this._buildDsu(color);
    const res = [];
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== EMPTY) continue;
        const nbr = [];
        if (x > 0 && b[x-1][y] === color) nbr.push(this._idx(x-1, y));
        if (x < n-1 && b[x+1][y] === color) nbr.push(this._idx(x+1, y));
        if (y > 0 && b[x][y-1] === color) nbr.push(this._idx(x, y-1));
        if (y < n-1 && b[x][y+1] === color) nbr.push(this._idx(x, y+1));
        if (nbr.length < 2) continue;
        let hit = false;
        for (let i = 0; i < nbr.length - 1 && !hit; i++) {
          const ri = dsu.find(nbr[i]);
          for (let j = i+1; j < nbr.length; j++)
            if (ri === dsu.find(nbr[j])) { hit = true; break; }
        }
        if (hit) {
          res.push([x, y]);
          if (limit !== undefined && res.length >= limit) return res;
        }
      }
    return res;
  }
  _t2AndForks(color) {
    const g = this.game, n = g.n, b = g.board;
    const cands = new Set();
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== EMPTY) continue;
        let cnt = 0;
        if (x > 0 && b[x-1][y] === color) cnt++;
        if (x < n-1 && b[x+1][y] === color) cnt++;
        if (y > 0 && b[x][y-1] === color) cnt++;
        if (y < n-1 && b[x][y+1] === color) cnt++;
        if (cnt >= 2) cands.add(x + "," + y);
      }
    const t2 = [], forks = [];
    for (const k of cands) {
      const xy = k.split(",").map(Number);
      b[xy[0]][xy[1]] = color;
      const t = this._threats(color, 3);
      b[xy[0]][xy[1]] = EMPTY;
      if (t.length >= 2) forks.push([xy[0], xy[1]]);
      else if (t.length === 1) t2.push([xy[0], xy[1]]);
    }
    return [t2, forks];
  }
  _genMoves(color, top) {
    const g = this.game, n = g.n, b = g.board;
    const opp = (color === BLACK ? WHITE : BLACK);
    const scored = [];
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== EMPTY) continue;
        let nm = 0, no = 0;
        if (x > 0) { const c = b[x-1][y]; if (c === color) nm++; else if (c === opp) no++; }
        if (x < n-1) { const c = b[x+1][y]; if (c === color) nm++; else if (c === opp) no++; }
        if (y > 0) { const c = b[x][y-1]; if (c === color) nm++; else if (c === opp) no++; }
        if (y < n-1) { const c = b[x][y+1]; if (c === color) nm++; else if (c === opp) no++; }
        if (nm === 0 && no === 0) continue;
        const s = nm*5 + no*3
          + 0.3*((n - Math.abs(2*x-(n-1))) + (n - Math.abs(2*y-(n-1))))
          + (this._rng() - 0.5);
        scored.push([s, [x, y]]);
      }
    scored.sort((a, b) => b[0] - a[0]);
    return scored.slice(0, top).map(p => p[1]);
  }
  _rootCandidates(t2m, fm, t2o, fo) {
    const g = this.game, n = g.n, b = g.board;
    const pool = new Map();
    const setp = (v, s) => {
      const k = v[0]+","+v[1];
      if (!pool.has(k) || pool.get(k) < s) pool.set(k, s);
    };
    for (const v of fm) setp(v, 5000);
    for (const v of fo) setp(v, 4600);
    for (const v of t2m) setp(v, 3000);
    for (const v of t2o) setp(v, 2800);
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        const c = b[x][y];
        if (c === EMPTY) continue;
        const base = (c === this.color) ? 1200 : 800;
        if (x > 0 && b[x-1][y] === EMPTY) setp([x-1, y], base);
        if (x < n-1 && b[x+1][y] === EMPTY) setp([x+1, y], base);
        if (y > 0 && b[x][y-1] === EMPTY) setp([x, y-1], base);
        if (y < n-1 && b[x][y+1] === EMPTY) setp([x, y+1], base);
      }
    const cx = (n-1)/2, cy = (n-1)/2;
    const items = [];
    for (const [k, s] of pool) {
      const xy = k.split(",").map(Number);
      items.push([s + 20*(n - Math.abs(xy[0]-cx) - Math.abs(xy[1]-cy))
                  + (this._rng() - 0.5), [xy[0], xy[1]], s]);
    }
    items.sort((a, b) => b[0] - a[0]);
    return items.slice(0, this._candLimit).map(p => [p[1], p[2]]);
  }
  _evaluate(me) {
    const opp = (me === BLACK ? WHITE : BLACK);
    const g = this.game, n = g.n, b = g.board;
    const dsuM = this._buildDsu(me), dsuO = this._buildDsu(opp);
    let myConn = 0, oppConn = 0, mySeeds = 0, oppSeeds = 0;
    let myMob = 0, oppMob = 0, myCnt = 0, oppCnt = 0, oppT1 = 0;
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        const c = b[x][y];
        if (c === me) {
          myCnt++;
          if (x > 0 && b[x-1][y] === EMPTY) myMob++;
          if (x < n-1 && b[x+1][y] === EMPTY) myMob++;
          if (y > 0 && b[x][y-1] === EMPTY) myMob++;
          if (y < n-1 && b[x][y+1] === EMPTY) myMob++;
        } else if (c === opp) {
          oppCnt++;
          if (x > 0 && b[x-1][y] === EMPTY) oppMob++;
          if (x < n-1 && b[x+1][y] === EMPTY) oppMob++;
          if (y > 0 && b[x][y-1] === EMPTY) oppMob++;
          if (y < n-1 && b[x][y+1] === EMPTY) oppMob++;
        } else {
          const mRoots = new Set(), oRoots = new Set();
          let mN = 0, oN = 0;
          if (x > 0) {
            const cc = b[x-1][y];
            if (cc === me) { mN++; mRoots.add(dsuM.find(this._idx(x-1, y))); }
            else if (cc === opp) { oN++; oRoots.add(dsuO.find(this._idx(x-1, y))); }
          }
          if (x < n-1) {
            const cc = b[x+1][y];
            if (cc === me) { mN++; mRoots.add(dsuM.find(this._idx(x+1, y))); }
            else if (cc === opp) { oN++; oRoots.add(dsuO.find(this._idx(x+1, y))); }
          }
          if (y > 0) {
            const cc = b[x][y-1];
            if (cc === me) { mN++; mRoots.add(dsuM.find(this._idx(x, y-1))); }
            else if (cc === opp) { oN++; oRoots.add(dsuO.find(this._idx(x, y-1))); }
          }
          if (y < n-1) {
            const cc = b[x][y+1];
            if (cc === me) { mN++; mRoots.add(dsuM.find(this._idx(x, y+1))); }
            else if (cc === opp) { oN++; oRoots.add(dsuO.find(this._idx(x, y+1))); }
          }
          if (mN >= 2 && mRoots.size < mN) return AI_WIN;
          if (oN >= 2 && oRoots.size < oN) {
            oppT1++;
            if (oppT1 >= 2) return AI_LOSS;
          }
          myConn += mRoots.size; oppConn += oRoots.size;
          if (mRoots.size >= 2) mySeeds++;
          if (oRoots.size >= 2) oppSeeds++;
        }
      }
    let score = 250*(mySeeds - oppSeeds) + 30*(myConn - oppConn)
      + 20*(myMob - oppMob) + 2*(myCnt - oppCnt);
    if (oppT1 === 1) score -= 120;
    return score;
  }
  _negamax(depth, alpha, beta, toMove) {
    if (performance.now() > this._deadline) return 0;
    if (this._threats(toMove, 1).length) return AI_WIN;
    const opp = (toMove === BLACK ? WHITE : BLACK);
    const t1o = this._threats(opp, 2);
    if (t1o.length >= 2) return AI_LOSS;
    if (depth <= 0) return this._evaluate(toMove);
    const cands = (t1o.length === 1) ? [t1o[0]] : this._genMoves(toMove, this._candLimit);
    const b = this.game.board;
    let best = AI_LOSS;
    for (const mv of cands) {
      if (performance.now() > this._deadline) break;
      b[mv[0]][mv[1]] = toMove;
      const v = -this._negamax(depth-1, -beta, -alpha, opp);
      b[mv[0]][mv[1]] = EMPTY;
      if (v > best) best = v;
      if (v > alpha) alpha = v;
      if (alpha >= beta) break;
    }
    return best;
  }
  chooseMove() {
    this._deadline = performance.now() + this.timeBudget * 1000;
    const g = this.game, n = g.n, b = g.board;
    this._candLimit = (n <= 15 ? 14 : 12);
    const t1 = this._threats(this.color, 1);
    if (t1.length) return t1[0];
    const t1o = this._threats(this.opp, 3);
    if (t1o.length === 1) return t1o[0];
    if (t1o.length >= 2) {
      const c = this._genMoves(this.color, 6);
      return c.length ? c[0] : this._anyEmpty();
    }
    const t0 = performance.now();
    const tf = this._t2AndForks(this.color);
    const of = this._t2AndForks(this.opp);
    this._deadline = performance.now()
      + Math.max(50, this.timeBudget*1000 - (performance.now() - t0));
    if (tf[1].length) return tf[1][0];        // 己方 fork: 必胜
    if (of[1].length) return of[1][0];        // 对方 fork: 必堵
    const cands = this._rootCandidates(tf[0], tf[1], of[0], of[1]);
    if (!cands.length) return this._anyEmpty();
    const depth = (n <= 15) ? Math.min(this.maxDepth, 5)
                            : Math.min(this.maxDepth, 4);
    let bestMove = cands[0][0], bestPrio = cands[0][1], bestVal = AI_LOSS - 1;
    for (const [mv, prio] of cands) {
      if (performance.now() > this._deadline) break;
      b[mv[0]][mv[1]] = this.color;
      const v = -this._negamax(depth-1, AI_LOSS, AI_WIN, this.opp);
      b[mv[0]][mv[1]] = EMPTY;
      if (v > bestVal + 25 || (bestVal - 25 <= v && prio > bestPrio)) {
        bestVal = v; bestMove = mv; bestPrio = prio;
      }
      if (v >= AI_WIN) break;
    }
    return bestMove;
  }
  _anyEmpty() {
    const g = this.game, n = g.n, b = g.board;
    let best = null, bd = 1e9;
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++)
        if (b[x][y] === EMPTY) {
          const d = Math.abs(x-(n-1)/2) + Math.abs(y-(n-1)/2);
          if (d < bd) { bd = d; best = [x, y]; }
        }
    return best;
  }
}

const AI_TIMEOUT_V2 = Symbol("ai-timeout-v2");

class HybridJordanAI extends LegacyJordanAI {
  constructor(game, color, timeBudget = 1.2, maxDepth = 8, seed = 1) {
    super(game, color, timeBudget, maxDepth, seed);
    this._tt = new Map();
    this._nodes = 0;
    this._ttHits = 0;
    this.lastStats = {completedDepth: 0, nodes: 0, ttHits: 0,
                      elapsed: 0, score: 0};
  }

  _checkTime() {
    if (this._deadline > 0 && performance.now() >= this._deadline)
      throw AI_TIMEOUT_V2;
  }

  _stateKey(toMove) {
    const b = this.game.board, n = this.game.n;
    let key = String(toMove) + "|";
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) key += String(b[x][y]);
    return key;
  }

  _boardFull() {
    const b = this.game.board, n = this.game.n;
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++)
        if (b[x][y] === EMPTY) return false;
    return true;
  }

  _t2AndForks(color) {
    // 单邻居延伸也可能在新棋旁边制造 T1，因此候选条件必须是 >=1。
    const g = this.game, n = g.n, b = g.board;
    const cands = [];
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== EMPTY) continue;
        let count = 0;
        if (x > 0 && b[x-1][y] === color) count++;
        if (x < n-1 && b[x+1][y] === color) count++;
        if (y > 0 && b[x][y-1] === color) count++;
        if (y < n-1 && b[x][y+1] === color) count++;
        if (count >= 1) cands.push([x, y]);
      }
    const t2 = [], forks = [];
    for (const move of cands) {
      this._checkTime();
      b[move[0]][move[1]] = color;
      let threats;
      try {
        threats = this._threats(color, 3);
      } finally {
        b[move[0]][move[1]] = EMPTY;
      }
      if (threats.length >= 2) forks.push(move);
      else if (threats.length === 1) t2.push(move);
    }
    return [t2, forks];
  }

  _genMoves(color, top) {
    // 去掉搜索顺序中的随机噪声，使逐层加深和回归测试可复现。
    const g = this.game, n = g.n, b = g.board;
    const opp = (color === BLACK ? WHITE : BLACK);
    const scored = [];
    for (let x = 0; x < n; x++)
      for (let y = 0; y < n; y++) {
        if (b[x][y] !== EMPTY) continue;
        let mine = 0, theirs = 0;
        if (x > 0) { const c=b[x-1][y]; if (c===color) mine++; else if (c===opp) theirs++; }
        if (x < n-1) { const c=b[x+1][y]; if (c===color) mine++; else if (c===opp) theirs++; }
        if (y > 0) { const c=b[x][y-1]; if (c===color) mine++; else if (c===opp) theirs++; }
        if (y < n-1) { const c=b[x][y+1]; if (c===color) mine++; else if (c===opp) theirs++; }
        if (mine === 0 && theirs === 0) continue;
        const centrality = 0.3*((n-Math.abs(2*x-(n-1)))+
                                (n-Math.abs(2*y-(n-1))));
        scored.push([mine*5 + theirs*3 + centrality, [x,y]]);
      }
    scored.sort((a,b) => b[0]-a[0] || a[1][0]-b[1][0] || a[1][1]-b[1][1]);
    return scored.slice(0, top).map(item => item[1]);
  }

  _rootCandidates(t2m, fm, t2o, fo) {
    // 所有战术点都保留；数量限制只作用于普通邻近走法。
    const b = this.game.board, n = this.game.n;
    const tactical = new Map(), quiet = new Map();
    const put = (map, move, score) => {
      const key = move[0] + "," + move[1];
      if (!map.has(key) || map.get(key).score < score)
        map.set(key, {move:[move[0],move[1]], score});
    };
    for (const m of fm) put(tactical, m, 5000);
    for (const m of fo) put(tactical, m, 4600);
    for (const m of t2m) put(tactical, m, 3000);
    for (const m of t2o) put(tactical, m, 2800);
    const cx=(n-1)/2, cy=(n-1)/2;
    for (let x=0; x<n; x++) for (let y=0; y<n; y++) {
      const c=b[x][y]; if (c===EMPTY) continue;
      const base=(c===this.color)?1200:800;
      for (const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1]]) {
        if (nx<0||nx>=n||ny<0||ny>=n||b[nx][ny]!==EMPTY) continue;
        const key=nx+","+ny;
        if (!tactical.has(key)) put(quiet,[nx,ny],base);
      }
    }
    const rank = entries => entries.map(item => {
      const x=item.move[0], y=item.move[1];
      return [item.score + 20*(n-Math.abs(x-cx)-Math.abs(y-cy)),
              item.move, item.score];
    }).sort((a,b)=>b[0]-a[0] || a[1][0]-b[1][0] || a[1][1]-b[1][1]);
    const forced = rank([...tactical.values()]);
    const room = Math.max(0, this._candLimit - forced.length);
    const normal = rank([...quiet.values()]).slice(0, room);
    return forced.concat(normal).map(item => [item[1],item[2]]);
  }

  _tacticalCandidates(toMove) {
    const opp = (toMove===BLACK ? WHITE : BLACK);
    const mine = this._t2AndForks(toMove);
    const theirs = this._t2AndForks(opp);
    const values = new Map();
    const put = (move, score) => {
      const key=move[0]+","+move[1];
      if (!values.has(key)||values.get(key).score<score)
        values.set(key,{move:[move[0],move[1]],score});
    };
    for (const m of mine[1]) put(m,5000);
    for (const m of theirs[1]) put(m,4600);
    for (const m of mine[0]) put(m,3000);
    for (const m of theirs[0]) put(m,2800);
    return [...values.values()].sort((a,b)=>b.score-a.score ||
      a.move[0]-b.move[0] || a.move[1]-b.move[1]).map(v=>v.move);
  }

  _negamax(depth, alpha, beta, toMove, extension=3) {
    this._nodes++;
    this._checkTime();
    const alphaStart=alpha, betaStart=beta;
    if (this._threats(toMove,1).length) return AI_WIN;
    const opp=(toMove===BLACK ? WHITE : BLACK);
    const opponentWins=this._threats(opp,2);
    if (opponentWins.length>=2) return AI_LOSS;
    if (this._boardFull()) return 0;

    const key=this._stateKey(toMove);
    const entry=this._tt.get(key);
    let ttMove=null;
    if (entry) {
      ttMove=entry.move;
      if (entry.depth>=depth && depth>0) {
        this._ttHits++;
        if (entry.flag===0) return entry.score;
        if (entry.flag===1) alpha=Math.max(alpha,entry.score);
        else beta=Math.min(beta,entry.score);
        if (alpha>=beta) return entry.score;
      }
    }

    let moves, nextDepth=depth-1, nextExtension=extension;
    if (opponentWins.length===1) {
      moves=[opponentWins[0]];
    } else if (depth<=0) {
      if (extension<=0) return this._evaluate(toMove);
      moves=this._tacticalCandidates(toMove).slice(0,10);
      if (!moves.length) return this._evaluate(toMove);
      nextDepth=0; nextExtension=extension-1;
    } else {
      moves=this._genMoves(toMove,this._candLimit);
    }
    if (!moves.length) return 0;
    if (ttMove) {
      const index=moves.findIndex(m=>m[0]===ttMove[0]&&m[1]===ttMove[1]);
      if (index>0) moves=[moves[index],...moves.slice(0,index),...moves.slice(index+1)];
    }

    const b=this.game.board;
    let best=AI_LOSS, bestMove=moves[0];
    for (const move of moves) {
      this._checkTime();
      b[move[0]][move[1]]=toMove;
      let value;
      try {
        value=-this._negamax(nextDepth,-beta,-alpha,opp,nextExtension);
      } finally {
        b[move[0]][move[1]]=EMPTY;
      }
      if (value>best) { best=value; bestMove=move; }
      if (value>alpha) alpha=value;
      if (alpha>=beta) break;
    }
    if (depth>0) {
      const flag=best<=alphaStart?2:(best>=betaStart?1:0);
      this._tt.set(key,{depth,score:best,flag,move:bestMove});
    }
    return best;
  }

  _searchRoot(depth, candidates) {
    let moves=candidates.map(item=>item[0]);
    const rootEntry=this._tt.get(this._stateKey(this.color));
    if (rootEntry) {
      const i=moves.findIndex(m=>m[0]===rootEntry.move[0]&&m[1]===rootEntry.move[1]);
      if (i>0) moves=[moves[i],...moves.slice(0,i),...moves.slice(i+1)];
    }
    let alpha=AI_LOSS, bestScore=AI_LOSS, bestMove=moves[0];
    const b=this.game.board;
    for (const move of moves) {
      this._checkTime();
      b[move[0]][move[1]]=this.color;
      let value;
      try {
        value=-this._negamax(depth-1,AI_LOSS,-alpha,this.opp,3);
      } finally {
        b[move[0]][move[1]]=EMPTY;
      }
      if (value>bestScore) { bestScore=value; bestMove=move; }
      if (value>alpha) alpha=value;
      if (value>=AI_WIN) break;
    }
    this._tt.set(this._stateKey(this.color),
                 {depth,score:bestScore,flag:0,move:bestMove});
    return [bestMove,bestScore];
  }

  chooseMove() {
    const started=performance.now();
    this._deadline=started+Math.max(10,this.timeBudget*1000);
    this._tt=new Map(); this._nodes=0; this._ttHits=0;
    let fallback=this._anyEmpty(), completedMove=fallback;
    let completedDepth=0, completedScore=0;
    try {
      const mine=this._threats(this.color,1);
      if (mine.length) { completedMove=mine[0]; completedScore=AI_WIN; }
      else {
        const theirs=this._threats(this.opp,3);
        if (theirs.length===1) completedMove=theirs[0];
        else if (theirs.length>=2) {
          completedMove=theirs[0]; completedScore=AI_LOSS;
        } else {
          const tf=this._t2AndForks(this.color);
          const of=this._t2AndForks(this.opp);
          if (tf[1].length) {
            completedMove=tf[1][0]; completedScore=AI_WIN;
          } else {
            const candidates=this._rootCandidates(tf[0],tf[1],of[0],of[1]);
            if (candidates.length) {
              completedMove=candidates[0][0];
              for (let depth=1; depth<=this.maxDepth; depth++) {
                this._checkTime();
                const result=this._searchRoot(depth,candidates);
                completedMove=result[0]; completedScore=result[1];
                completedDepth=depth;
                if (completedScore>=AI_WIN) break;
              }
            }
          }
        }
      }
    } catch (error) {
      if (error!==AI_TIMEOUT_V2) throw error;
    }
    this.lastStats={completedDepth,nodes:this._nodes,ttHits:this._ttHits,
                    elapsed:(performance.now()-started)/1000,
                    score:completedScore};
    return completedMove;
  }
}

// ================= V3: 增量连通状态 + PVS =================
const V3_MATE = 1000000, V3_INF = 1100000;
const AI_TIMEOUT_V3 = Symbol("ai-timeout-v3");

class RollbackDSUV3 {
  constructor(count) {
    this.parent = Array(count).fill(-1);
    this.size = Array(count).fill(0);
    this.stack = [];
  }
  find(item) {
    while (this.parent[item] !== item) item = this.parent[item];
    return item;
  }
  snapshot() { return this.stack.length; }
  activate(item) {
    this.stack.push(["a", item]);
    this.parent[item] = item; this.size[item] = 1;
  }
  union(first, second) {
    let a=this.find(first), b=this.find(second);
    if (a===b) return false;
    if (this.size[a] < this.size[b]) [a,b]=[b,a];
    this.stack.push(["u",b,a,this.size[a]]);
    this.parent[b]=a; this.size[a]+=this.size[b];
    return true;
  }
  rollback(snapshot) {
    while (this.stack.length > snapshot) {
      const event=this.stack.pop();
      if (event[0]==="a") {
        this.parent[event[1]]=-1; this.size[event[1]]=0;
      } else {
        const [,child,root,oldSize]=event;
        this.parent[child]=child; this.size[root]=oldSize;
      }
    }
  }
  clearHistory() { this.stack=[]; }
}

class SearchStateV3 {
  constructor(game) {
    this.size=game.size; this.n=game.n; this.count=this.n*this.n;
    this.board=[];
    for (let x=0;x<this.n;x++) for (let y=0;y<this.n;y++)
      this.board.push(game.board[x][y]);
    this.emptyCount=this.board.filter(v=>v===EMPTY).length;
    this.dsu={};
    this.dsu[BLACK]=new RollbackDSUV3(this.count);
    this.dsu[WHITE]=new RollbackDSUV3(this.count);
    this.neighbors=Array.from({length:this.count},(_,i)=>this._neighbors(i));
    this.zobrist=this._makeZobrist(); this.hash=0n;
    this._buildComponents();
  }
  _neighbors(index) {
    const x=Math.floor(index/this.n), y=index%this.n, out=[];
    if (x>0) out.push(index-this.n);
    if (x+1<this.n) out.push(index+this.n);
    if (y>0) out.push(index-1);
    if (y+1<this.n) out.push(index+1);
    return out;
  }
  _makeZobrist() {
    const mask=(1n<<64n)-1n;
    let value=(0x4a4f5244414en ^ BigInt(this.n)) & mask;
    const next=()=>{
      value=(value+0x9e3779b97f4a7c15n)&mask;
      let z=value;
      z=((z^(z>>30n))*0xbf58476d1ce4e5b9n)&mask;
      z=((z^(z>>27n))*0x94d049bb133111ebn)&mask;
      return (z^(z>>31n))&mask;
    };
    return Array.from({length:this.count},()=>[next(),next()]);
  }
  _buildComponents() {
    for (let i=0;i<this.count;i++) {
      const color=this.board[i]; if (color===EMPTY) continue;
      this.dsu[color].activate(i); this.hash^=this.zobrist[i][color-1];
    }
    for (let i=0;i<this.count;i++) {
      const color=this.board[i]; if (color===EMPTY) continue;
      const x=Math.floor(i/this.n), y=i%this.n;
      if (x+1<this.n && this.board[i+this.n]===color)
        this.dsu[color].union(i,i+this.n);
      if (y+1<this.n && this.board[i+1]===color)
        this.dsu[color].union(i,i+1);
    }
    this.dsu[BLACK].clearHistory(); this.dsu[WHITE].clearHistory();
  }
  xy(index) { return [Math.floor(index/this.n),index%this.n]; }
  index(move) { return move[0]*this.n+move[1]; }
  sameColorRoots(move,color) {
    const dsu=this.dsu[color], roots=[];
    for (const nb of this.neighbors[move])
      if (this.board[nb]===color) roots.push(dsu.find(nb));
    return roots;
  }
  isWinningMove(move,color) {
    if (this.board[move]!==EMPTY) return false;
    const roots=this.sameColorRoots(move,color);
    return roots.length!==new Set(roots).size;
  }
  winningMoves(color,limit=null) {
    const out=[];
    for (let move=0;move<this.count;move++) {
      if (this.board[move]===EMPTY && this.isWinningMove(move,color)) {
        out.push(move); if (limit!==null && out.length>=limit) break;
      }
    }
    return out;
  }
  play(move,color) {
    if (this.board[move]!==EMPTY) throw new Error("occupied V3 move");
    const dsu=this.dsu[color], snapshot=dsu.snapshot();
    const roots=this.sameColorRoots(move,color);
    const won=roots.length!==new Set(roots).size;
    this.board[move]=color; this.emptyCount--;
    this.hash^=this.zobrist[move][color-1]; dsu.activate(move);
    for (const nb of this.neighbors[move])
      if (this.board[nb]===color) dsu.union(move,nb);
    return {move,color,snapshot,won};
  }
  undo(token) {
    this.dsu[token.color].rollback(token.snapshot);
    this.hash^=this.zobrist[token.move][token.color-1];
    this.board[token.move]=EMPTY; this.emptyCount++;
  }
  frontierMoves() {
    const out=[];
    for (let move=0;move<this.count;move++) {
      if (this.board[move]!==EMPTY) continue;
      if (this.neighbors[move].some(nb=>this.board[nb]!==EMPTY)) out.push(move);
    }
    return out;
  }
}

class JordanAI {
  constructor(game,color,timeBudget=2.0,maxDepth=12,seed=1) {
    this.game=game; this.color=color;
    this.opp=(color===BLACK?WHITE:BLACK);
    this.timeBudget=timeBudget; this.maxDepth=maxDepth; this.seed=seed;
    this.weights={fork:18000,t2:620,mergePoint:170,frontierEdge:26,
      componentSquare:3,largestComponent:8,openSquareOne:10,
      openSquareTwo:210,center:1};
    this.historyScores=Array.from({length:3},()=>Array(game.n*game.n).fill(0));
    this.lastStats={completedDepth:0,nodes:0,ttHits:0,cutoffs:0,
      elapsed:0,score:0,pv:[]};
  }
  static other(color) { return color===BLACK?WHITE:BLACK; }
  _key(color) { return this.state.hash.toString(16)+"|"+color; }
  _checkTime() {
    if (performance.now()>=this.deadline) throw AI_TIMEOUT_V3;
  }
  _prepare() {
    this.state=new SearchStateV3(this.game);
    this.tt=new Map(); this.analysisCache=new Map();
    this.tacticalCache=new Map(); this.featureCache=new Map();
    this.killers=new Map(); this.nodes=0; this.ttHits=0; this.cutoffs=0;
  }
  _analysis(color) {
    const key=this._key(color);
    if (this.analysisCache.has(key)) return this.analysisCache.get(key);
    const dsu=this.state.dsu[color], componentSizes=new Map();
    for (let move=0;move<this.state.count;move++) if (this.state.board[move]===color) {
      const root=dsu.find(move);
      componentSizes.set(root,(componentSizes.get(root)||0)+1);
    }
    const threats=[], moveRoots=new Map(), frontiers=new Map();
    for (let move=0;move<this.state.count;move++) {
      if (this.state.board[move]!==EMPTY) continue;
      const roots=[];
      for (const nb of this.state.neighbors[move])
        if (this.state.board[nb]===color) roots.push(dsu.find(nb));
      const unique=[...new Set(roots)].sort((a,b)=>a-b);
      moveRoots.set(move,unique);
      if (unique.length<roots.length) threats.push(move);
      for (const root of unique) {
        if (!frontiers.has(root)) frontiers.set(root,new Set());
        frontiers.get(root).add(move);
      }
    }
    const sizes=[...componentSizes.values()].sort((a,b)=>b-a);
    const result={threats,moveRoots,frontiers,componentSizes:sizes};
    this.analysisCache.set(key,result); return result;
  }
  _winningMoves(color,limit=null) {
    const threats=this._analysis(color).threats;
    return limit===null?threats:threats.slice(0,limit);
  }
  _tacticalMap(color) {
    const key=this._key(color);
    if (this.tacticalCache.has(key)) return this.tacticalCache.get(key);
    const analysis=this._analysis(color), result=new Map();
    if (analysis.threats.length) { this.tacticalCache.set(key,result); return result; }
    for (const [move,joinedRoots] of analysis.moveRoots) {
      this._checkTime(); if (!joinedRoots.length) continue;
      const created=new Set();
      if (joinedRoots.length>=2) for (let i=0;i<joinedRoots.length-1;i++)
        for (let j=i+1;j<joinedRoots.length;j++) {
          const a=analysis.frontiers.get(joinedRoots[i])||new Set();
          const b=analysis.frontiers.get(joinedRoots[j])||new Set();
          for (const point of a) if (b.has(point)) created.add(point);
        }
      const joined=new Set(joinedRoots);
      for (const nb of this.state.neighbors[move]) {
        if (this.state.board[nb]!==EMPTY) continue;
        const roots=analysis.moveRoots.get(nb)||[];
        if (roots.some(root=>joined.has(root))) created.add(nb);
      }
      created.delete(move);
      if (created.size) result.set(move,[...created].sort((a,b)=>a-b));
    }
    this.tacticalCache.set(key,result); return result;
  }

  _features(color) {
    const key=this._key(color);
    if (this.featureCache.has(key)) return this.featureCache.get(key);
    const opp=JordanAI.other(color), analysis=this._analysis(color);
    const tactical=this._tacticalMap(color);
    let forks=0;
    for (const wins of tactical.values()) if (wins.length>=2) forks++;
    const t2=tactical.size-forks;
    let mergePoints=0, frontierEdges=0, centerScore=0;
    const center=(this.state.n-1)/2;
    for (let move=0;move<this.state.count;move++) {
      const value=this.state.board[move];
      if (value===EMPTY) {
        const roots=analysis.moveRoots.get(move)||[];
        if (roots.length>=2) mergePoints++;
        for (const nb of this.state.neighbors[move])
          if (this.state.board[nb]===color) frontierEdges++;
      } else if (value===color) {
        const [x,y]=this.state.xy(move);
        centerScore+=Math.trunc(2*this.state.n-Math.abs(x-center)-Math.abs(y-center));
      }
    }
    let componentSquare=0;
    for (const size of analysis.componentSizes) componentSquare+=size*size;
    const largestComponent=analysis.componentSizes.length?analysis.componentSizes[0]:0;
    let openSquareOne=0, openSquareTwo=0;
    const n=this.state.n, board=this.state.board;
    for (let x=0;x<n-1;x++) for (let y=0;y<n-1;y++) {
      const base=x*n+y;
      const values=[board[base],board[base+n],board[base+1],board[base+n+1]];
      if (values.includes(opp)) continue;
      const count=values.filter(v=>v===color).length;
      if (count===1) openSquareOne++;
      else if (count===2) openSquareTwo++;
    }
    const result={forks,t2,mergePoints,frontierEdges,componentSquare,
      largestComponent,openSquareOne,openSquareTwo,center:centerScore};
    this.featureCache.set(key,result); return result;
  }
  _weighted(f) {
    const w=this.weights;
    return f.forks*w.fork+f.t2*w.t2+f.mergePoints*w.mergePoint+
      f.frontierEdges*w.frontierEdge+f.componentSquare*w.componentSquare+
      f.largestComponent*w.largestComponent+f.openSquareOne*w.openSquareOne+
      f.openSquareTwo*w.openSquareTwo+f.center*w.center;
  }
  _evaluate(color) {
    return this._weighted(this._features(color))-
      this._weighted(this._features(JordanAI.other(color)));
  }
  _positionalOrder(move,color) {
    const opponent=JordanAI.other(color);
    const mine=this.state.sameColorRoots(move,color).length;
    const theirs=this.state.sameColorRoots(move,opponent).length;
    const [x,y]=this.state.xy(move), center=(this.state.n-1)/2;
    const centrality=Math.trunc(4*this.state.n-2*Math.abs(x-center)-2*Math.abs(y-center));
    let squareGain=0, n=this.state.n;
    for (const sx of [x-1,x]) for (const sy of [y-1,y]) {
      if (sx<0||sx>=n-1||sy<0||sy>=n-1) continue;
      const points=[sx*n+sy,(sx+1)*n+sy,sx*n+sy+1,(sx+1)*n+sy+1];
      const values=points.map(p=>this.state.board[p]);
      if (!values.includes(opponent)) squareGain+=16*values.filter(v=>v===color).length;
      if (!values.includes(color)) squareGain+=13*values.filter(v=>v===opponent).length;
    }
    return 60*mine+42*theirs+centrality+squareGain;
  }
  _orderedMoves(color,depth,ply,tacticalOnly=false,ttMove=null,root=false) {
    const opponent=JordanAI.other(color);
    const mine=this._tacticalMap(color), theirs=this._tacticalMap(opponent);
    const scored=new Map();
    const add=(move,score)=>{
      if (this.state.board[move]===EMPTY)
        scored.set(move,Math.max(scored.has(move)?scored.get(move):-V3_INF,score));
    };
    for (const [move,wins] of mine) add(move,wins.length>=2?700000:500000);
    for (const [move,wins] of theirs) {
      add(move,wins.length>=2?620000:430000);
      if (wins.length>=2) for (const block of wins) add(block,390000);
    }
    if (!tacticalOnly) {
      const frontier=new Set(this.state.frontierMoves());
      if (root) {
        const empties=[];
        for (let move=0;move<this.state.count;move++)
          if (this.state.board[move]===EMPTY) empties.push(move);
        empties.sort((a,b)=>this._positionalOrder(b,color)-this._positionalOrder(a,color)||a-b);
        for (const move of empties.slice(0,6)) frontier.add(move);
      }
      const quiet=[];
      for (const move of frontier) if (!scored.has(move))
        quiet.push([this._positionalOrder(move,color),move]);
      quiet.sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
      const totalLimit=root?20:(depth>=6?10:(depth>=4?12:16));
      const room=Math.max(0,totalLimit-scored.size);
      for (const [score,move] of quiet.slice(0,room))
        add(move,score+this.historyScores[color][move]);
    }
    const killers=this.killers.get(ply)||[];
    killers.forEach((move,rank)=>{if(scored.has(move))scored.set(move,scored.get(move)+100000-rank*1000);});
    if (ttMove!==null && scored.has(ttMove)) scored.set(ttMove,scored.get(ttMove)+1000000);
    return [...scored.entries()].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).map(item=>item[0]);
  }
  _recordCutoff(color,move,depth,ply) {
    this.cutoffs++; this.historyScores[color][move]+=Math.max(1,depth*depth);
    const killers=(this.killers.get(ply)||[]).filter(value=>value!==move);
    killers.unshift(move); this.killers.set(ply,killers.slice(0,2));
  }
  _pvs(depth,alpha,beta,color,ply,qdepth=4) {
    this.nodes++; this._checkTime();
    const alphaStart=alpha, opponent=JordanAI.other(color);
    if (this._winningMoves(color,1).length) return V3_MATE-ply;
    const opponentWins=this._winningMoves(opponent,2);
    if (opponentWins.length>=2) return -V3_MATE+ply;
    if (this.state.emptyCount===0) return 0;
    const key=this._key(color), entry=this.tt.get(key);
    const ttMove=entry?entry.move:null;
    if (entry && entry.depth>=depth && depth>0) {
      this.ttHits++;
      if (entry.flag===0) return entry.score;
      if (entry.flag===1) alpha=Math.max(alpha,entry.score);
      else beta=Math.min(beta,entry.score);
      if (alpha>=beta) return entry.score;
    }
    let moves,nextDepth,nextQdepth;
    if (opponentWins.length===1) {
      moves=[opponentWins[0]]; nextDepth=Math.max(0,depth-1); nextQdepth=qdepth;
    } else if (depth<=0) {
      if (qdepth<=0) return this._evaluate(color);
      const forcing=new Set(this._tacticalMap(color).keys());
      if (!forcing.size) return this._evaluate(color);
      moves=this._orderedMoves(color,depth,ply,true,ttMove).filter(m=>forcing.has(m)).slice(0,10);
      if (!moves.length) return this._evaluate(color);
      nextDepth=0; nextQdepth=qdepth-1;
    } else {
      moves=this._orderedMoves(color,depth,ply,false,ttMove);
      nextDepth=depth-1; nextQdepth=qdepth;
    }
    if (!moves.length) return 0;
    let best=-V3_INF,bestMove=moves[0];
    for (let index=0;index<moves.length;index++) {
      const move=moves[index]; this._checkTime();
      const token=this.state.play(move,color); let score;
      try {
        if (token.won) score=V3_MATE-ply;
        else if (index===0)
          score=-this._pvs(nextDepth,-beta,-alpha,opponent,ply+1,nextQdepth);
        else {
          score=-this._pvs(nextDepth,-alpha-1,-alpha,opponent,ply+1,nextQdepth);
          if (alpha<score && score<beta)
            score=-this._pvs(nextDepth,-beta,-alpha,opponent,ply+1,nextQdepth);
        }
      } finally { this.state.undo(token); }
      if (score>best) { best=score; bestMove=move; }
      if (score>alpha) alpha=score;
      if (alpha>=beta) { this._recordCutoff(color,move,depth,ply); break; }
    }
    if (depth>0) {
      const flag=best<=alphaStart?2:(best>=beta?1:0);
      this.tt.set(key,{depth,score:best,flag,move:bestMove});
    }
    return best;
  }
  _searchRoot(depth,moves) {
    const key=this._key(this.color), entry=this.tt.get(key);
    if (entry && moves.includes(entry.move))
      moves=[entry.move,...moves.filter(move=>move!==entry.move)];
    let alpha=-V3_INF,beta=V3_INF,best=-V3_INF,bestMove=moves[0];
    for (let index=0;index<moves.length;index++) {
      const move=moves[index]; this._checkTime();
      const token=this.state.play(move,this.color); let score;
      try {
        if (token.won) score=V3_MATE;
        else if (index===0) score=-this._pvs(depth-1,-beta,-alpha,this.opp,1);
        else {
          score=-this._pvs(depth-1,-alpha-1,-alpha,this.opp,1);
          if (alpha<score && score<beta)
            score=-this._pvs(depth-1,-beta,-alpha,this.opp,1);
        }
      } finally { this.state.undo(token); }
      if (score>best) { best=score; bestMove=move; }
      if (score>alpha) alpha=score;
      if (score>=V3_MATE-2) break;
    }
    this.tt.set(key,{depth,score:best,flag:0,move:bestMove});
    return [bestMove,best];
  }
  _principalVariation(limit=16) {
    const result=[],tokens=[]; let color=this.color;
    try {
      for (let i=0;i<limit;i++) {
        const entry=this.tt.get(this._key(color));
        if (!entry||entry.move===null||this.state.board[entry.move]!==EMPTY) break;
        result.push(this.state.xy(entry.move));
        const token=this.state.play(entry.move,color); tokens.push(token);
        if (token.won) break; color=JordanAI.other(color);
      }
    } finally { for (let i=tokens.length-1;i>=0;i--) this.state.undo(tokens[i]); }
    return result;
  }
  chooseMove() {
    const started=performance.now();
    this.deadline=started+Math.max(10,this.timeBudget*1000); this._prepare();
    const empties=[];
    for (let move=0;move<this.state.count;move++) if (this.state.board[move]===EMPTY) empties.push(move);
    if (!empties.length) return null;
    const center=(this.state.n-1)/2;
    empties.sort((a,b)=>{
      const [ax,ay]=this.state.xy(a),[bx,by]=this.state.xy(b);
      return (Math.abs(ax-center)+Math.abs(ay-center))-
        (Math.abs(bx-center)+Math.abs(by-center))||a-b;
    });
    let completedMove=empties[0],completedScore=0,completedDepth=0;
    try {
      const mine=this._winningMoves(this.color,1);
      if (mine.length) { completedMove=mine[0]; completedScore=V3_MATE; }
      else {
        const theirs=this._winningMoves(this.opp,3);
        if (theirs.length===1) completedMove=theirs[0];
        else if (theirs.length>=2) { completedMove=theirs[0]; completedScore=-V3_MATE; }
        else {
          const tactical=this._tacticalMap(this.color);
          const forks=[...tactical.entries()].filter(item=>item[1].length>=2).map(item=>item[0]);
          if (forks.length) { completedMove=forks[0]; completedScore=V3_MATE-2; }
          else {
            const moves=this._orderedMoves(this.color,1,0,false,null,true);
            if (moves.length) {
              completedMove=moves[0];
              for (let depth=1;depth<=this.maxDepth;depth++) {
                this._checkTime();
                const [move,score]=this._searchRoot(depth,moves);
                completedMove=move; completedScore=score; completedDepth=depth;
                if (score>=V3_MATE-2) break;
              }
            }
          }
        }
      }
    } catch (error) { if (error!==AI_TIMEOUT_V3) throw error; }
    const pv=this._principalVariation();
    this.lastStats={completedDepth,nodes:this.nodes,ttHits:this.ttHits,
      cutoffs:this.cutoffs,elapsed:(performance.now()-started)/1000,
      score:completedScore,pv};
    return this.state.xy(completedMove);
  }
}

// ================= 界面 =================
// AI 搜索放入 Web Worker，避免两秒搜索阻塞按钮、绘图和模式切换。
const AI_WORKER_CORE = document.currentScript.textContent
  .split("// ================= 界面 =================")[0];
const AI_WORKER_SOURCE = AI_WORKER_CORE + `
self.onmessage = event => {
  const request = event.data;
  try {
    const game = new JordanChess(request.size);
    game.board = request.board.map(row => row.slice());
    game.turn = request.turn;
    game.history = request.history.map(move => move.slice());
    game.winner = null;
    const ai = new JordanAI(game, request.color, request.timeBudget,
      request.maxDepth, request.seed);
    if (request.historyScores)
      ai.historyScores = request.historyScores.map(row => row.slice());
    const move = ai.chooseMove();
    self.postMessage({id:request.id, ok:true, move,
      stats:ai.lastStats, historyScores:ai.historyScores});
  } catch (error) {
    self.postMessage({id:request.id, ok:false,
      error:String(error && (error.stack || error.message) || error)});
  }
};`;
const AI_WORKER_URL = URL.createObjectURL(
  new Blob([AI_WORKER_SOURCE], {type:"text/javascript"}));
window.addEventListener("beforeunload", () => URL.revokeObjectURL(AI_WORKER_URL));

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const sizeInput = document.getElementById("size");
const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
let MARGIN = 20, CELL = 60, SIZE = 660;
let game = null;

// 画布自适应: 不超过视口宽, 格子大小随棋盘尺寸变化
function resizeCanvas() {
  const avail = Math.min(660, (window.innerWidth || 390) - 16);
  MARGIN = Math.max(14, Math.round(avail * 0.05));
  CELL = (avail - MARGIN * 2) / game.size;   // size = 方格数 = 格点段数
  SIZE = avail;
  canvas.width = SIZE * dpr; canvas.height = SIZE * dpr;
  canvas.style.width = SIZE + "px"; canvas.style.height = SIZE + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);    // 重置并应用高分屏缩放
}

let boardSize = 10;
function startNewGame() {
  cancelPendingAI();
  game = new JordanChess(boardSize);
  resetAIMemory();
  resizeCanvas();
  draw();
  statusEl.textContent = gameMode === MODE_AI_AI
    ? `AI-AI 对战开始：黑方 AI 先手（${boardSize}×${boardSize} 方格）`
    : gameMode === MODE_HUMAN_AI
      ? (humanColor === BLACK ? "你执黑（先手），AI 执白。" : "你执白（后手），AI 执黑先走。")
      : `新局开始：黑方先手（${boardSize}×${boardSize} 方格）`;
  statusEl.classList.add("info");
  scheduleAIMoveIfNeeded();
}
function applySizeFromInput() {
  const v = parseInt(sizeInput.value, 10);
  if (!Number.isInteger(v) || v < 2 || v > 30) {
    sizeInput.value = boardSize;
    statusEl.textContent = "棋盘大小需为 2~30 的整数";
    statusEl.classList.add("info");
    return;
  }
  boardSize = v;
  startNewGame();
}

function xy(x, y) { return [MARGIN + x * CELL, MARGIN + y * CELL]; }

function draw() {
  ctx.clearRect(0, 0, SIZE, SIZE);
  // 网格
  ctx.strokeStyle = "#999"; ctx.lineWidth = 1;
  const gridEnd = MARGIN + (game.n - 1) * CELL;
  for (let i = 0; i < game.n; i++) {
    const p = MARGIN + i * CELL;
    ctx.beginPath(); ctx.moveTo(p, MARGIN); ctx.lineTo(p, gridEnd); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MARGIN, p); ctx.lineTo(gridEnd, p); ctx.stroke();
  }
  // 坐标标签
  ctx.fillStyle = "#888"; ctx.font = "11px sans-serif"; ctx.textAlign = "center";
  for (let i = 0; i < game.n; i++) {
    ctx.fillText(i, MARGIN + i*CELL, MARGIN - 8);
    ctx.fillText(i, MARGIN - 14, MARGIN + i*CELL + 4);
  }
  // 闭环高亮
  const loopWidth = Math.max(2, Math.round(CELL * 0.09));
  for (const loop of game.lastLoops) {
    const pts = loop.map(([x,y]) => xy(x,y));
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath();
    ctx.fillStyle = "rgba(211,47,47,0.14)"; ctx.fill();
    ctx.strokeStyle = "#d32f2f"; ctx.lineWidth = loopWidth; ctx.stroke();
  }
  // 棋子(大小随棋盘格子缩放, 直径约 0.84 格)
  const pieceR = CELL * 0.42;
  for (let x = 0; x < game.n; x++)
    for (let y = 0; y < game.n; y++) {
      const c = game.board[x][y];
      if (c === EMPTY) continue;
      const [px, py] = xy(x, y);
      ctx.beginPath(); ctx.arc(px, py, pieceR, 0, Math.PI*2);
      ctx.fillStyle = (c === BLACK) ? "#1a1a1a" : "#fafafa";
      ctx.fill();
      ctx.strokeStyle = "#999"; ctx.lineWidth = Math.max(1, CELL * 0.045); ctx.stroke();
    }
  // 最后一步(光圈随格子缩放)
  if (game.lastMove) {
    const [px, py] = xy(game.lastMove[0], game.lastMove[1]);
    ctx.beginPath(); ctx.arc(px, py, CELL * 0.52, 0, Math.PI*2);
    ctx.strokeStyle = "#e0b020"; ctx.lineWidth = loopWidth; ctx.stroke();
  }
  // 状态
  statusEl.className = "";
  if (game.winner !== null) {
    if (game.winner === "DRAW") statusEl.textContent = "棋盘已满 —— 平局！";
    else { statusEl.textContent = CNAME[game.winner] + "获胜！"; statusEl.classList.add("win"); }
  } else {
    statusEl.textContent = "轮到：" + CNAME[game.turn];
  }
}

canvas.addEventListener("click", (ev) => {
  if (game.winner !== null) return;
  if (gameMode === MODE_AI_AI) return;
  if (gameMode === MODE_HUMAN_AI && game.turn !== humanColor) return;
  const rect = canvas.getBoundingClientRect();
  const sx = (ev.clientX - rect.left) * (SIZE / rect.width);
  const sy = (ev.clientY - rect.top) * (SIZE / rect.height);
  let best = null, bestD = CELL * 0.5;
  for (let x = 0; x < game.n; x++)
    for (let y = 0; y < game.n; y++) {
      const [px, py] = xy(x, y);
      const d = Math.hypot(sx - px, sy - py);
      if (d < bestD) { best = [x, y]; bestD = d; }
    }
  if (!best) return;
  const r = game.place(best[0], best[1]);
  if (!r.ok) {
    statusEl.textContent = r.reason;
    statusEl.classList.add("info");
  } else if (r.loops.length > 0) {
    statusEl.textContent = `★ 形成闭环 ${r.loops.length} 个 —— 立即获胜！`;
    statusEl.classList.add("info");
    draw();
    setTimeout(draw, 400);   // 稍后展示胜利横幅
  }
  draw();
  scheduleAIMoveIfNeeded();
});

document.getElementById("undo").addEventListener("click", () => {
  const pausedAIvsAI = gameMode === MODE_AI_AI;
  cancelPendingAI();
  if (pausedAIvsAI) {
    gameMode = MODE_LOCAL;
    updateModeButtons();
  }
  const undone = game.undo();
  resetAIMemory();
  draw();
  statusEl.textContent = undone
    ? (pausedAIvsAI ? "AI-AI 对战已暂停，并撤销了一步。" : "已悔棋。")
    : "没有可撤销的步骤。";
  statusEl.classList.add("info");
  scheduleAIMoveIfNeeded();
});
document.getElementById("new").addEventListener("click", applySizeFromInput);
sizeInput.addEventListener("change", applySizeFromInput);

// ---- 对局模式: 双人 / 人机 / AI-AI ----
const MODE_LOCAL = "local", MODE_HUMAN_AI = "human-ai", MODE_AI_AI = "ai-ai";
let gameMode = MODE_LOCAL;
let humanColor = BLACK;
let aiMemory = {[BLACK]: null, [WHITE]: null};
let aiGeneration = 0;
let aiThinking = false;
let activeAIWorker = null;
let activeAITimer = null;
const aiBtn = document.getElementById("ai");
const aiVsAiBtn = document.getElementById("aivai");
const sideBtn = document.getElementById("side");
function aiColor() { return humanColor === BLACK ? WHITE : BLACK; }
function resetAIMemory() {
  aiMemory = {[BLACK]: null, [WHITE]: null};
}
function cancelPendingAI() {
  aiGeneration++;
  aiThinking = false;
  if (activeAITimer !== null) {
    clearTimeout(activeAITimer);
    activeAITimer = null;
  }
  if (activeAIWorker !== null) {
    activeAIWorker.terminate();
    activeAIWorker = null;
  }
}
function isAITurn() {
  if (!game || game.winner !== null) return false;
  if (gameMode === MODE_AI_AI) return true;
  return gameMode === MODE_HUMAN_AI && game.turn === aiColor();
}
function updateModeButtons() {
  aiBtn.classList.toggle("on", gameMode === MODE_HUMAN_AI);
  aiVsAiBtn.classList.toggle("on", gameMode === MODE_AI_AI);
  aiVsAiBtn.textContent = gameMode === MODE_AI_AI ? "暂停AI对战" : "AI-AI";
  sideBtn.textContent = humanColor === BLACK ? "执黑" : "执白";
  sideBtn.style.display = gameMode === MODE_HUMAN_AI ? "" : "none";
}
function scheduleAIMoveIfNeeded(delay = 30) {
  if (!isAITurn() || aiThinking) return;
  const token = ++aiGeneration;
  const activeGame = game;
  const color = game.turn;
  aiThinking = true;
  draw();
  statusEl.textContent = `${CNAME[color]} AI 思考中…`;
  statusEl.classList.add("info");
  activeAITimer = setTimeout(() => {
    activeAITimer = null;
    if (token !== aiGeneration || game !== activeGame || game.turn !== color || !isAITurn()) {
      if (token === aiGeneration) aiThinking = false;
      return;
    }
    const worker = new Worker(AI_WORKER_URL);
    activeAIWorker = worker;
    const fail = message => {
      if (activeAIWorker === worker) activeAIWorker = null;
      worker.terminate();
      if (token !== aiGeneration) return;
      aiThinking = false;
      draw();
      statusEl.textContent = message;
      statusEl.classList.add("info");
    };
    worker.onerror = event => {
      event.preventDefault();
      console.error(event.message || event);
      fail(`${CNAME[color]} AI 后台计算失败，请重新开始对局。`);
    };
    worker.onmessage = event => {
      if (activeAIWorker === worker) activeAIWorker = null;
      worker.terminate();
      const data = event.data;
      if (token !== aiGeneration || game !== activeGame || game.turn !== color || !isAITurn())
        return;
      if (!data.ok) {
        console.error(data.error);
        fail(`${CNAME[color]} AI 计算失败，请重新开始对局。`);
        return;
      }
      aiMemory[color] = data.historyScores;
      const mv = data.move;
      if (!mv) {
        aiThinking = false;
        draw();
        return;
      }
      const r = game.place(mv[0], mv[1]);
      aiThinking = false;
      draw();
      if (r.ok && r.loops.length > 0) {
        statusEl.textContent = `★ ${CNAME[color]} AI 形成闭环 ${r.loops.length} 个 —— 获胜！`;
        statusEl.classList.add("info");
      } else if (r.ok) {
        statusEl.textContent = `${CNAME[color]} AI 落子：(${mv[0]}, ${mv[1]})`;
        statusEl.classList.add("info");
      }
      if (gameMode === MODE_AI_AI && game.winner === null)
        scheduleAIMoveIfNeeded(180);
    };
    worker.postMessage({
      id:token, size:activeGame.size,
      board:activeGame.board.map(row => row.slice()),
      turn:activeGame.turn,
      history:activeGame.history.map(move => move.slice()),
      color, timeBudget:2.0, maxDepth:12, seed:1,
      historyScores:aiMemory[color],
    });
  }, delay);
}
aiBtn.addEventListener("click", () => {
  cancelPendingAI();
  gameMode = gameMode === MODE_HUMAN_AI ? MODE_LOCAL : MODE_HUMAN_AI;
  updateModeButtons();
  draw();
  statusEl.textContent = gameMode === MODE_HUMAN_AI
    ? "人机模式：点「执黑/执白」选边。"
    : "双人模式。";
  statusEl.classList.add("info");
  scheduleAIMoveIfNeeded();
});
aiVsAiBtn.addEventListener("click", () => {
  const pausing = gameMode === MODE_AI_AI;
  cancelPendingAI();
  gameMode = pausing ? MODE_LOCAL : MODE_AI_AI;
  updateModeButtons();
  draw();
  statusEl.textContent = pausing
    ? "AI-AI 对战已暂停；再次点击可继续。"
    : "AI-AI 对战：两个 V3 AI 将自动轮流落子。";
  statusEl.classList.add("info");
  scheduleAIMoveIfNeeded();
});
sideBtn.addEventListener("click", () => {
  humanColor = (humanColor === BLACK) ? WHITE : BLACK;
  updateModeButtons();
  startNewGame();
});

updateModeButtons();
startNewGame();   // 首次开局(默认 10×10)
</script>
</body>
</html>
